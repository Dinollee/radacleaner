name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker + Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "08fa8a530c85d31a11b04446d9c3ade6"
        run: ./node_modules/.bin/wrangler deploy

      - name: Deploy Pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "08fa8a530c85d31a11b04446d9c3ade6"
        run: |
          mv ../wrangler.jsonc ../wrangler.worker.jsonc
          mv ../wrangler.pages.jsonc ../wrangler.jsonc
          ./node_modules/.bin/wrangler pages deploy "$GITHUB_WORKSPACE/dashboard" --project-name radacleaner-dashboard --branch main --commit-dirty=true --cwd "$GITHUB_WORKSPACE"
          mv ../wrangler.jsonc ../wrangler.pages.jsonc
          mv ../wrangler.worker.jsonc ../wrangler.jsonc
