name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker + Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Debug environment
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "08fa8a530c85d31a11b04446d9c3ade6"
        run: |
          echo "=== Token check ==="
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "Token prefix: ${CLOUDFLARE_API_TOKEN:0:6}..."
          echo "Account: $CLOUDFLARE_ACCOUNT_ID"
          echo "=== Wrangler check ==="
          ./node_modules/.bin/wrangler --version
          echo "=== Config check ==="
          cat wrangler.jsonc
          echo "=== Auth check ==="
          ./node_modules/.bin/wrangler whoami 2>&1 || true

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "08fa8a530c85d31a11b04446d9c3ade6"
        run: ./node_modules/.bin/wrangler deploy --yes 2>&1

      - name: Deploy Pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "08fa8a530c85d31a11b04446d9c3ade6"
        run: ./node_modules/.bin/wrangler pages deploy ../dashboard --project-name radacleaner-dashboard --branch main 2>&1
