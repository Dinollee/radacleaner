<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страж Демократії — Моніторинг ВРУ</title>
<style>
:root {
  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-card: #16213e;
  --bg-hover: #1e2a45;
  --text-primary: #e0e6f0;
  --text-secondary: #8899b4;
  --text-muted: #5a6a85;
  --accent-blue: #4a9eff;
  --accent-green: #2ecc71;
  --accent-red: #e74c3c;
  --accent-orange: #f39c12;
  --accent-yellow: #f1c40f;
  --accent-purple: #9b59b6;
  --border-color: #2a2a4a;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  
  /* Faction colors */
  --color-sluga: #19950b;
  --color-es: #ffff00;
  --color-batkiv: #0057b8;
  --color-platforma: #ff6600;
  --color-dovira: #00bcd4;
  --color-maybutne: #ff9800;
  --color-golos: #9c27b0;
  --color-vidnovlennya: #4caf50;
  --color-pozafrak: #888888;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}

/* Layout */
.app-header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0; z-index: 100;
}
.header-left {
  text-align: center;
}
.app-header h1 {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.app-header .subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  -webkit-text-fill-color: var(--text-secondary);
}
.header-stats {
  display: flex; gap: 20px; align-items: center;
}
.header-stat {
  text-align: center;
}
.header-stat .num { font-size: 20px; font-weight: 700; color: var(--accent-blue); }
.header-stat .label { font-size: 11px; color: var(--text-secondary); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }

/* Tabs */
.tab-nav {
  display: flex;
  justify-content: center;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0 24px;
  gap: 4px;
}
.tab-btn {
  padding: 14px 24px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
  font-family: var(--font);
}
.tab-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
.tab-btn.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
.tab-content { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
.tab-content.active { display: block; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  transition: var(--transition);
}
.card:hover { border-color: rgba(74,158,255,0.3); }
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Grids */
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:1024px){ .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: 1fr; } }
@media(max-width:768px){ .grid-4, .grid-2 { grid-template-columns: 1fr; } }

/* Dashboard stat cards */
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  transition: var(--transition);
}
.stat-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
.stat-card .icon { font-size: 28px; margin-bottom: 8px; }
.stat-card .value { font-size: 32px; font-weight: 700; }
.stat-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

/* Faction accordion */
.faction-list { display: flex; flex-direction: column; gap: 6px; }
.faction-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  overflow: hidden;
  transition: var(--transition);
}
.faction-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  cursor: pointer;
  gap: 12px;
  transition: var(--transition);
}
.faction-header:hover { background: var(--bg-hover); }
.faction-color {
  width: 14px; height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
}
.faction-name { flex: 1; font-weight: 500; font-size: 14px; }
.faction-stats { display: flex; gap: 16px; font-size: 13px; }
.faction-stat { text-align: center; min-width: 40px; }
.faction-stat .n { font-weight: 700; display: block; }
.faction-stat .l { font-size: 10px; color: var(--text-muted); }
.stat-za .n { color: var(--accent-green); }
.stat-proti .n { color: var(--accent-red); }
.stat-utr .n { color: var(--accent-orange); }
.stat-vid .n { color: var(--text-muted); }
.faction-arrow { transition: transform 0.3s; color: var(--text-muted); font-size: 12px; }
.faction-item.open .faction-arrow { transform: rotate(180deg); }

.faction-deputies {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.3s;
  padding: 0 16px;
}
.faction-item.open .faction-deputies {
  max-height: 2000px;
  padding: 0 16px 12px;
}
.deputy-row {
  display: flex;
  align-items: center;
  padding: 6px 8px;
  gap: 10px;
  border-radius: 6px;
  font-size: 13px;
  transition: var(--transition);
}
.deputy-row:hover { background: var(--bg-hover); }
.deputy-name { flex: 1; }
.deputy-vote {
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.deputy-vote.za { background: rgba(46,204,113,0.2); color: var(--accent-green); }
.deputy-vote.proti { background: rgba(231,76,60,0.2); color: var(--accent-red); }
.deputy-vote.utr { background: rgba(243,156,18,0.2); color: var(--accent-orange); }
.deputy-vote.ne { background: rgba(90,106,133,0.2); color: var(--text-muted); }
.deputy-vote.vid { background: rgba(90,106,133,0.15); color: var(--text-muted); }

/* ===== VOTE BLOCKS (clickable vote bars → factions → deputies) ===== */
.vote-block {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  overflow: hidden;
  transition: var(--transition);
}
.vote-block:hover { border-color: rgba(74,158,255,0.3); }
.vote-block.expanded { border-color: var(--accent-blue); }

.vote-block-header {
  padding: 14px 16px;
  cursor: pointer;
  transition: var(--transition);
}
.vote-block-header:hover { background: var(--bg-hover); }

.vote-block-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.vote-block-summary {
  display: flex;
  gap: 12px;
  font-size: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.vote-count { white-space: nowrap; }
.vote-count.za { color: var(--accent-green); }
.vote-count.proti { color: var(--accent-red); }
.vote-count.utr { color: var(--accent-orange); }
.vote-count.ne { color: var(--text-muted); }
.vote-count.vid { color: var(--text-muted); opacity: 0.7; }

.vote-bar {
  display: flex;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  background: var(--bg-secondary);
  margin-bottom: 6px;
}
.vote-bar-seg { height: 100%; transition: width 0.3s; }
.vote-bar-seg.za { background: var(--accent-green); }
.vote-bar-seg.proti { background: var(--accent-red); }
.vote-bar-seg.utr { background: var(--accent-orange); }
.vote-bar-seg.ne { background: var(--text-muted); }
.vote-bar-seg.vid { background: #3a3a5a; }

.vote-expand-hint {
  font-size: 11px;
  color: var(--text-muted);
  transition: var(--transition);
}
.vote-block.expanded .vote-expand-hint {
  color: var(--accent-blue);
}

.vote-factions {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
  border-top: 1px solid transparent;
}
.vote-block.expanded .vote-factions {
  max-height: 5000px;
  border-top-color: var(--border-color);
}

/* Faction detail items inside vote block */
.faction-detail-list {
  padding: 8px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.faction-detail-item {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  overflow: hidden;
  transition: var(--transition);
}
.faction-detail-item:hover { border-color: rgba(74,158,255,0.2); }
.faction-detail-item.open { border-color: var(--accent-blue); }

.faction-detail-header {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  cursor: pointer;
  gap: 10px;
  transition: var(--transition);
}
.faction-detail-header:hover { background: var(--bg-hover); }

.faction-mini-stats {
  display: flex;
  gap: 8px;
  font-size: 12px;
  margin-left: auto;
}
.mini-stat.za { color: var(--accent-green); }
.mini-stat.proti { color: var(--accent-red); }
.mini-stat.utr { color: var(--accent-orange); }
.mini-stat.ne { color: var(--text-muted); }
.mini-stat.vid { color: var(--text-muted); opacity: 0.7; }

.faction-deputies-wrap {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.faction-detail-item.open .faction-deputies-wrap {
  max-height: 3000px;
}

.deputies-filter {
  display: flex;
  gap: 6px;
  padding: 8px 14px;
  border-top: 1px solid var(--border-color);
  flex-wrap: wrap;
}
.filter-btn {
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background: transparent;
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
  transition: var(--transition);
  font-family: var(--font);
}
.filter-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); }
.filter-btn.active {
  background: rgba(74,158,255,0.15);
  border-color: var(--accent-blue);
  color: var(--accent-blue);
}

.deputies-list {
  padding: 4px 14px 10px;
  max-height: 400px;
  overflow-y: auto;
}
.deputies-list .deputy-row {
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
}
.deputies-list .deputy-name {
  font-size: 12px;
}
.deputies-list .deputy-vote {
  font-size: 10px;
  padding: 1px 8px;
}

/* Bill list */
.bill-search {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 14px;
  margin-bottom: 16px;
  font-family: var(--font);
}
.bill-search:focus { outline: none; border-color: var(--accent-blue); }
.bill-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: var(--transition);
}
.bill-item:hover { border-color: var(--accent-blue); background: var(--bg-hover); }
.bill-item-header { display: flex; align-items: flex-start; gap: 12px; }
.bill-number {
  font-weight: 700;
  color: var(--accent-blue);
  font-size: 14px;
  white-space: nowrap;
}
.bill-title { flex: 1; font-size: 14px; line-height: 1.4; }
.bill-status {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  white-space: nowrap;
}
.bill-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
.bill-risk {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}
.bill-risk.high { background: rgba(231,76,60,0.2); color: var(--accent-red); }
.bill-risk.medium { background: rgba(243,156,18,0.2); color: var(--accent-orange); }
.bill-risk.low { background: rgba(46,204,113,0.2); color: var(--accent-green); }

/* Bill detail panel */
.bill-detail {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 24px;
  margin-top: 16px;
  border-left: 3px solid var(--accent-blue);
}
.bill-detail.open { display: block; }
.bill-detail-close {
  float: right;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
}
.bill-detail-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.detail-section { margin-bottom: 20px; }
.detail-section h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent-blue);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border-color);
}

/* Timeline */
.timeline { position: relative; padding-left: 24px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--border-color);
}
.timeline-item {
  position: relative;
  padding: 8px 0 8px 16px;
  font-size: 13px;
}
.timeline-item::before {
  content: '';
  position: absolute;
  left: -20px;
  top: 12px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--accent-blue);
  border: 2px solid var(--bg-primary);
}
.timeline-item .date { font-size: 11px; color: var(--text-muted); }
.timeline-item .desc { color: var(--text-primary); }

/* ===== PLENARY CALENDAR ===== */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 12px;
}
.cal-header {
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 0;
  font-weight: 600;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 13px;
  cursor: default;
  transition: var(--transition);
  position: relative;
  background: var(--bg-secondary);
  color: var(--text-secondary);
}
.cal-day:hover { background: var(--bg-hover); }
.cal-day.empty { background: transparent; }
.cal-day.today {
  border: 2px solid var(--accent-blue);
  color: var(--text-primary);
  font-weight: 700;
}
.cal-day.session {
  background: rgba(74,158,255,0.15);
  color: var(--accent-blue);
  font-weight: 600;
}
.cal-day.session::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent-blue);
}
.cal-day.vote-day {
  background: rgba(46,204,113,0.15);
  color: var(--accent-green);
  font-weight: 600;
}
.cal-day.vote-day::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent-green);
}
.cal-day.weekend {
  color: var(--text-muted);
  opacity: 0.5;
}
.cal-day .cal-bills {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 2px;
}
.cal-legend {
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: var(--text-secondary);
  flex-wrap: wrap;
  margin-top: 8px;
}
.cal-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.cal-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.cal-legend-dot.session { background: rgba(74,158,255,0.4); }
.cal-legend-dot.vote { background: rgba(46,204,113,0.4); }
.cal-legend-dot.today { border: 2px solid var(--accent-blue); background: transparent; }

/* Calendar month nav */
.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cal-nav-btn {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: var(--transition);
  font-family: var(--font);
}
.cal-nav-btn:hover { border-color: var(--accent-blue); color: var(--text-primary); }
.cal-month-year {
  font-weight: 600;
  font-size: 15px;
  color: var(--text-primary);
}

/* Session list below calendar */
.cal-sessions {
  margin-top: 12px;
  border-top: 1px solid var(--border-color);
  padding-top: 12px;
}
.cal-session-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-color);
  font-size: 13px;
}
.cal-session-item:last-child { border-bottom: none; }
.cal-session-date {
  min-width: 70px;
  text-align: center;
}
.cal-session-date .day {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent-blue);
  line-height: 1;
}
.cal-session-date .month {
  font-size: 11px;
  color: var(--text-muted);
}
.cal-session-info { flex: 1; }
.cal-session-title {
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.cal-session-bills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.cal-session-bill {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: rgba(74,158,255,0.1);
  color: var(--accent-blue);
  cursor: pointer;
  transition: var(--transition);
}
.cal-session-bill:hover { background: rgba(74,158,255,0.25); }

/* LLM Analysis */
.risk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 10px; }
.risk-item {
  background: var(--bg-secondary);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
}
.risk-item .label { font-size: 12px; color: var(--text-secondary); }
.risk-item .score { font-size: 24px; font-weight: 700; margin: 4px 0; }
.risk-item .desc { font-size: 12px; color: var(--text-muted); }

/* Deputies table */
.deputies-toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.deputies-toolbar input, .deputies-toolbar select {
  padding: 10px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
}
.deputies-toolbar input { flex: 1; min-width: 200px; }
.deputies-toolbar select { min-width: 160px; }
.deputies-toolbar input:focus, .deputies-toolbar select:focus { outline: none; border-color: var(--accent-blue); }

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th {
  text-align: left;
  padding: 12px 10px;
  border-bottom: 2px solid var(--border-color);
  color: var(--text-secondary);
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
.data-table th:hover { color: var(--accent-blue); }
.data-table th .sort-icon { margin-left: 4px; font-size: 10px; }
.data-table td {
  padding: 10px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: middle;
}
.data-table tr:hover td { background: var(--bg-hover); }
.data-table .dep-faction {
  display: flex; align-items: center; gap: 8px;
}
.data-table .faction-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.kpd-bar {
  display: inline-block;
  height: 6px;
  border-radius: 3px;
  margin-right: 6px;
  vertical-align: middle;
}
.kpd-high { color: var(--accent-green); }
.kpd-mid { color: var(--accent-orange); }

// ===== DATE FORMATTER =====
function formatDate(dateStr) {
  if (!dateStr) return '—';
  // Handle both yyyy-mm-dd and ISO datetime
  const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[3]}.${m[2]}.${m[1]}`;
  return dateStr;
}

// ===== API HELPERS =====
async function apiFetch(path) {
  try {
    const resp = await fetch(API_BASE + path);
    if (!resp.ok) return null;
    return await resp.json();
  } catch (e) {
    console.warn('API fetch error:', path, e);
    return null;
  }
}

let CACHED_BILLS = [];    // список законів для пошуку
let CACHED_BILL_MAP = {}; // id → bill object (з деталями)

async function loadStats() {
  const data = await apiFetch('/stats');
  if (!data) return;
  setText('headerBills', data.totalBills);
  setText('headerVotes', data.totalVotes);
  setText('headerDeputies', data.totalMps || '—');
  setText('headerFactions', FACTIONS.length);
}
function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

let CURRENT_PAGE = 0;
const PAGE_SIZE = 50;
let TOTAL_BILLS = 0;

async function loadBillsList(search, status, stage, sort, page) {
  const params = new URLSearchParams({ limit: PAGE_SIZE, offset: (page || 0) * PAGE_SIZE });
  if (search) params.set('search', search);
  if (status) params.set('status', status);
  if (stage) params.set('stage', stage);
  if (sort) {
    const [s, o] = sort.split(':');
    params.set('sort', s);
    params.set('order', o);
  }
  const data = await apiFetch('/bills?' + params.toString());
  if (data && data.bills) {
    CACHED_BILLS = data.bills;
    TOTAL_BILLS = data.total || 0;
  } else {
    CACHED_BILLS = [];
    TOTAL_BILLS = 0;
  }
  CURRENT_PAGE = page || 0;
  return CACHED_BILLS;
}

async function loadBillDetail(id) {
  const data = await apiFetch(`/bills/${id}`);
  if (data) {
    CACHED_BILL_MAP[id] = data;
  }
  return data || CACHED_BILL_MAP[id];
}

// ===== DOM HELPERS =====
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) 
    if (k === 'className') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  for (const c of children) 
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  return e;
}

// ===== TAB SWITCHING =====

    btn.classList.add('active');
    const tabId = btn.dataset.tab;
    document.getElementById('tab-' + tabId).classList.add('active');
  });
});

function selectBill(billId, switchTab) {
  if (switchTab) {

  }

async function renderDashboard() {
  const list = document.getElementById('dashBillList');
  list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Завантаження...</div>';

  const data = await apiFetch('/bills?limit=5');
  const bills = data?.bills || [];

  list.innerHTML = '';
  if (!bills.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">Немає даних</div>';
    return;
  }

  bills.forEach(b => {
    const riskScore = b.stage || 1;
    const riskClass = riskScore >= 4 ? 'low' : riskScore >= 2 ? 'medium' : 'high';
    const riskLabel = riskScore >= 4 ? 'Низький' : riskScore >= 2 ? 'Помірний' : 'Новий';
    const statusColor = b.current_status === 'Закон підписано' || b.current_status === 'Закон прийнято'
      ? 'background:rgba(46,204,113,0.2);color:#2ecc71'
      : b.current_status === 'new' ? 'background:rgba(90,106,133,0.2);color:#8899b4'
      : 'background:rgba(243,156,18,0.2);color:#f39c12';

    list.appendChild(el('div', { className: 'bill-item', onclick: function(){ selectBill(b.id, true); } },
      el('div', { className: 'bill-item-header' },
        el('span', { className: 'bill-number' }, '#' + b.bill_number),
        el('span', { className: 'bill-title' }, (b.title || '').slice(0,60) + ((b.title||'').length > 60 ? '...' : '')),
        el('span', { style: statusColor, className: 'bill-status' }, b.current_status || 'new')
      ),
      el('div', { className: 'bill-meta' },
        el('span', {}, '📅 ' + formatDate(b.registration_date)),
        el('span', { className: 'bill-risk ' + riskClass }, 'Стан: ' + riskLabel),
        el('span', {}, '📋 ' + (b.committee || '').slice(0,30))
      )
    ));
  });

  renderCalendar(); // calendar статичний
}

let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

function renderCalendar() {
  const container = document.getElementById('dashCalendar');
  if (!container) return;
  
  const months = ['Січень','Лютий','Березень','Квітень','Травень','Червень',
                  'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  const days = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
  
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  
  // Build session date set for quick lookup
  const sessionDates = {};
  PLENARY_SESSIONS.forEach(s => { sessionDates[s.date] = s; });
  
  // First day of month
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDay = new Date(calYear, calMonth + 1, 0);
  const startDow = (firstDay.getDay() + 6) % 7; // Mon=0
  const totalDays = lastDay.getDate();
  
  let html = `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calMonth--; if(calMonth<0){calMonth=11;calYear--}; renderCalendar()">◀</button>
      <span class="cal-month-year">${months[calMonth]} ${calYear}</span>
      <button class="cal-nav-btn" onclick="calMonth++; if(calMonth>11){calMonth=0;calYear++}; renderCalendar()">▶</button>
    </div>
    <div class="cal-grid">
  `;
  
  // Day headers
  days.forEach(d => { html += `<div class="cal-header">${d}</div>`; });
  
  // Empty cells before first day
  for (let i = 0; i < startDow; i++) {
    html += `<div class="cal-day empty"></div>`;
  }
  
  // Days
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(calYear, calMonth, d).getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isToday = dateStr === todayStr;
    const session = sessionDates[dateStr];
    
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (session) cls += session.bills.length ? ' vote-day' : ' session';
    if (isWeekend) cls += ' weekend';
    
    const billsLabel = session && session.bills.length ? `${session.bills.length} закон.` : '';
    
    html += `<div class="${cls}" title="${session ? session.title : ''}">
      <span>${d}</span>
      ${billsLabel ? `<span class="cal-bills">${billsLabel}</span>` : ''}
    </div>`;
  }
  
  html += `</div>`;
  
  // Legend
  html += `
    <div class="cal-legend">
      <div class="cal-legend-item"><span class="cal-legend-dot today"></span> Сьогодні</div>
      <div class="cal-legend-item"><span class="cal-legend-dot session"></span> Засідання</div>
      <div class="cal-legend-item"><span class="cal-legend-dot vote"></span> Голосування</div>
    </div>
  `;
  
  // Upcoming sessions list
  const upcoming = PLENARY_SESSIONS.filter(s => s.date >= todayStr).slice(0, 4);
  if (upcoming.length) {
    html += `<div class="cal-sessions">`;
    upcoming.forEach(s => {
      const dt = s.date.split('-');
      const dayNum = parseInt(dt[2]);
      const monthName = months[parseInt(dt[1])-1].slice(0,3).toLowerCase();
      html += `
        <div class="cal-session-item">
          <div class="cal-session-date">
            <div class="day">${dayNum}</div>
            <div class="month">${monthName}</div>
          </div>
          <div class="cal-session-info">
            <div class="cal-session-title">${s.title}</div>
            ${s.bills.length ? `
              <div class="cal-session-bills">
                ${s.bills.map(b => {
                  const bill = (window.CACHED_BILLS || []).find(x => x.bill_number === b);
                  return `<span class="cal-session-bill" onclick="selectBill(${bill ? bill.id : 0}, true)">#${b}${bill ? ' — ' + bill.title.slice(0,40) + '...' : ''}</span>`;
                }).join('')}
              </div>
            ` : '<div style="font-size:12px;color:var(--text-muted);">Законопроєкти не заплановано</div>'}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }
  
  container.innerHTML = html;
}

// ===== BILLS TAB =====
async function renderBills() {

function renderPagination() {
  const pagEl = document.getElementById('billPagination');
  const totalPages = Math.ceil(TOTAL_BILLS / PAGE_SIZE);
  if (totalPages <= 1) { pagEl.innerHTML = ''; return; }

  let html = '';
  // Prev
  html += `<button class="page-btn" ${CURRENT_PAGE===0?'disabled':''} onclick="goToPage(${CURRENT_PAGE-1})">◀ Назад</button>`;

  // Page numbers — show up to 7 around current
  const start = Math.max(0, CURRENT_PAGE - 3);
  const end = Math.min(totalPages, CURRENT_PAGE + 4);
  for (let i = start; i < end; i++) {
    html += `<button class="page-btn ${i===CURRENT_PAGE?'active':''}" onclick="goToPage(${i})">${i+1}</button>`;
  }

  // Next
  html += `<button class="page-btn" ${CURRENT_PAGE>=totalPages-1?'disabled':''} onclick="goToPage(${CURRENT_PAGE+1})">Вперед ▶</button>`;

  pagEl.innerHTML = html;
}

      const stageLabel = b.stage >= 5 ? '✅ Прийнято' : b.stage >= 4 ? '📋 Підписано' : b.stage >= 3 ? '🔄 На розгляді' : b.stage >= 2 ? '📝 Зареєстровано' : '🆕 Новий';

// Render factions for a specific vote in the bill detail panel
function renderVoteFactions(bill, voteIdx, container) {
  const vote = bill.votes[voteIdx];
  if (!vote) return;

  // Deterministic deputy votes based on bill+voteIdx (so they don't change on re-render)
  const seed = bill.id * 100 + voteIdx;
  
  const factionsHtml = FACTIONS.map(f => {
    const names = DEPUTY_NAMES[f.id] || [];
    const prof = FACTION_VOTE_PROFILES[f.id] || { za:0.5, proti:0.05, utr:0.1, ne:0.2, vid:0.15 };
    
    // Simulate faction totals
    let za = 0, proti = 0, utr = 0, ne = 0, vid = 0;
    const deputyVotes = [];
    
    for (const name of names) {
      // Use a simple hash for deterministic "random" per deputy
      const r = pseudoRandom(seed + name.length + name.charCodeAt(0));
      let cum = 0;
      let state = 'vid';
      for (const s of VOTE_STATES) {
        cum += prof[s] || 0;
        if (r < cum) { state = s; break; }
      }
      if (state === 'za') za++;
      else if (state === 'proti') proti++;
      else if (state === 'utr') utr++;
      else if (state === 'ne') ne++;
      else vid++;
      
      deputyVotes.push({ name, state });
    }
    
    const total = za + proti + utr + ne + vid || 1;
    const pct = v => Math.round(v/total*100);
    
    const vmap = {
      za: ['za','✅ За'],
      proti: ['proti','❌ Проти'],
      utr: ['utr','⏸️ Утримався'],
      ne: ['ne','⬜ Не голосував'],
      vid: ['vid','🚫 Відсутній']
    };
    
    // Build deputy list HTML
    const deputiesHtml = deputyVotes.map(d => {
      const vd = vmap[d.state] || vmap.vid;
      return `<div class="deputy-row"><span class="deputy-name">${d.name}</span><span class="deputy-vote ${vd[0]}">${vd[1]}</span></div>`;
    }).join('');
    
    return `
      <div class="faction-detail-item" data-faction="${f.id}">
        <div class="faction-detail-header" onclick="this.parentElement.classList.toggle('open')">
          <span class="faction-color" style="background:${f.color}"></span>
          <span class="faction-name">${f.name}</span>
          <span class="faction-mini-stats">
            <span class="mini-stat za">✅${za}</span>
            <span class="mini-stat proti">❌${proti}</span>
            <span class="mini-stat utr">⏸️${utr}</span>
            <span class="mini-stat ne">⬜${ne}</span>
            <span class="mini-stat vid">🚫${vid}</span>
          </span>
          <span class="faction-arrow">▼</span>
        </div>
        <div class="faction-deputies-wrap">
          <div class="deputies-filter">
            <button class="filter-btn active" onclick="filterDeputies(this, 'all')">Всі</button>
            <button class="filter-btn" onclick="filterDeputies(this, 'za')">За</button>
            <button class="filter-btn" onclick="filterDeputies(this, 'proti')">Проти</button>
            <button class="filter-btn" onclick="filterDeputies(this, 'utr')">Утримались</button>
            <button class="filter-btn" onclick="filterDeputies(this, 'vid')">Відсутні</button>
          </div>
          <div class="deputies-list">${deputiesHtml}</div>
        </div>
      </div>`;
  }).join('');
  
  container.innerHTML = `<div class="faction-detail-list">${factionsHtml}</div>`;
}

// Simple pseudo-random for deterministic deputy votes
function pseudoRandom(seed) {
  const x = Math.sin(seed * 9301 + 49297) * 49297;
  return x - Math.floor(x);
}

// Filter deputies by vote type
function filterDeputies(btn, type) {
  const wrap = btn.closest('.faction-deputies-wrap');
  wrap.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  wrap.querySelectorAll('.deputy-row').forEach(row => {
    if (type === 'all') {
      row.style.display = '';
    } else {
      const voteSpan = row.querySelector('.deputy-vote');
      row.style.display = voteSpan.classList.contains(type) ? '' : 'none';
    }
  });
}

// ===== DEPUTIES TAB =====
function renderDeputies(filter, factionFilter) {
  const tbody = document.getElementById('deputiesBody');
  tbody.innerHTML = '';
  
  let deps = [...ALL_DEPUTIES];
  
  if (filter) {
    const f = filter.toLowerCase();
    deps = deps.filter(d => d.name.toLowerCase().includes(f) || d.factionName.toLowerCase().includes(f));
  }
  if (factionFilter) {
    deps = deps.filter(d => d.faction === factionFilter);
  }
  
  // Sort by kpd desc by default
  deps.sort((a,b) => b.kpd - a.kpd);
  
  if (deps.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text-muted);">Нічого не знайдено</td></tr>';
    return;
  }
  
  for (const d of deps) {
    const f = FACTIONS.find(x => x.id === d.faction);
    const color = f ? f.color : '#888';
    
    const kpdClass = d.kpd >= 80 ? 'kpd-high' : d.kpd >= 60 ? 'kpd-mid' : 'kpd-low';
    const barColor = d.kpd >= 80 ? 'var(--accent-green)' : d.kpd >= 60 ? 'var(--accent-orange)' : 'var(--accent-red)';
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:500;">${d.name}</td>
      <td><div class="dep-faction"><span class="faction-dot" style="background:${color}"></span>${d.factionName}</div></td>
      <td>${d.votes} (відвідано ${d.attended})</td>
      <td>
        <span style="display:inline-flex;align-items:center;gap:6px;">
          <span class="kpd-bar" style="width:${d.kpd}px;max-width:80px;background:${barColor}"></span>
          <span class="${kpdClass}">${d.kpd}%</span>
        </span>
      </td>
    `;
    tbody.appendChild(tr);
  }
}

// Deputies search
document.getElementById('depSearch').addEventListener('input', function() {
  renderDeputies(this.value, document.getElementById('depFactionFilter').value);
});
document.getElementById('depFactionFilter').addEventListener('change', function() {

  opt.textContent = f.name;
  facFilter.appendChild(opt);

(async function init() {

  await loadStatuses();
  await renderDashboard();
  await renderBills();
