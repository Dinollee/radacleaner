<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страж Демократії — Моніторинг ВРУ</title>
<style>
:root {
  --bg: #0a0a12;
  --bg2: #12121f;
  --bg3: #1a1a2e;
  --card: #16162a;
  --hover: #1e1e3a;
  --text: #e0e6f0;
  --text2: #8899b4;
  --muted: #5a6a85;
  --blue: #4a9eff;
  --green: #2ecc71;
  --red: #e74c3c;
  --orange: #f39c12;
  --yellow: #f1c40f;
  --purple: #9b59b6;
  --border: #252545;
  --radius: 10px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
.header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 56px; position: sticky; top: 0; z-index: 100; }
.logo { font-size: 18px; font-weight: 700; color: var(--blue); margin-right: 32px; white-space: nowrap; }
.logo span { color: var(--text2); font-weight: 400; font-size: 14px; margin-left: 8px; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: none; color: var(--text2); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
nav button:hover { background: var(--hover); color: var(--text); }
nav button.active { background: var(--blue); color: #fff; }

/* Layout */
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.section { display: none; }
.section.active { display: block; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: 600; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
.stat-value { font-size: 28px; font-weight: 700; margin: 8px 0 4px; }
.stat-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; padding: 10px 12px; color: var(--text2); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--hover); }
tr.clickable { cursor: pointer; }

/* Badges */
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.badge-high { background: rgba(231,76,60,0.15); color: var(--red); }
.badge-medium { background: rgba(243,156,18,0.15); color: var(--orange); }
.badge-low { background: rgba(46,204,113,0.15); color: var(--green); }
.badge-stage1 { background: rgba(136,153,180,0.15); color: var(--text2); }
.badge-stage2 { background: rgba(74,158,255,0.15); color: var(--blue); }
.badge-stage3 { background: rgba(155,89,182,0.15); color: var(--purple); }
.badge-stage4 { background: rgba(46,204,113,0.15); color: var(--green); }
.badge-stage5 { background: rgba(231,76,60,0.15); color: var(--red); }

/* Progress bar */
.progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

/* Stage bar */
.stage-bar { display: flex; gap: 2px; margin: 8px 0; }
.stage-bar span { height: 8px; flex: 1; border-radius: 2px; background: var(--border); }
.stage-bar span.filled { background: var(--blue); }

/* Filters */
.filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
.filters input { flex: 1; min-width: 200px; }
.filters select { min-width: 140px; }

/* Diff */
.diff-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.diff-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; max-height: 500px; overflow-y: auto; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.diff-panel .added { background: rgba(46,204,113,0.15); color: var(--green); }
.diff-panel .removed { background: rgba(231,76,60,0.15); color: var(--red); text-decoration: line-through; }
.diff-header { font-weight: 600; color: var(--text2); margin-bottom: 8px; font-size: 12px; text-transform: uppercase; }

/* KPD */
.kpd-bar { display: flex; align-items: center; gap: 8px; }
.kpd-value { font-weight: 600; min-width: 40px; }
.kpd-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.kpd-fill { height: 100%; border-radius: 4px; }

/* Vote bar */
.vote-bar { display: flex; height: 24px; border-radius: 4px; overflow: hidden; gap: 1px; }
.vote-bar .yes { background: var(--green); }
.vote-bar .no { background: var(--red); }
.vote-bar .abstain { background: var(--orange); }
.vote-bar .not-present { background: var(--muted); }

/* Detail panel */
.detail-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.detail-row { display: flex; gap: 12px; margin-bottom: 8px; }
.detail-label { color: var(--text2); min-width: 120px; font-size: 13px; }
.detail-value { font-size: 14px; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.tabs button { background: none; border: none; color: var(--text2); padding: 8px 16px; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--blue); border-bottom-color: var(--blue); }

/* Schedule */
.schedule-item { display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.schedule-date { min-width: 100px; font-weight: 600; color: var(--blue); font-size: 14px; }
.schedule-info { flex: 1; }
.schedule-title { font-size: 14px; margin-bottom: 4px; }
.schedule-meta { font-size: 12px; color: var(--text2); }

/* Back button */
.back-btn { background: none; border: 1px solid var(--border); color: var(--text2); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 16px; }
.back-btn:hover { background: var(--hover); color: var(--text); }

/* Risk categories */
.risk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.risk-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.risk-cat { font-size: 12px; color: var(--text2); text-transform: uppercase; margin-bottom: 4px; }
.risk-quote { font-size: 13px; font-style: italic; color: var(--text2); margin: 6px 0; border-left: 2px solid var(--border); padding-left: 8px; }
.risk-explanation { font-size: 13px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text2); }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 768px) {
  .diff-container { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .header { padding: 0 12px; }
  .container { padding: 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Страж Демократії <span>ВРУ IX</span></div>
  <nav>
    <button class="active" onclick="showSection('dashboard')">Дашборд</button>
    <button onclick="showSection('bills')">Законопроєкти</button>
    <button onclick="showSection('deputies')">Депутати</button>
    <button onclick="showSection('schedule')">Графік</button>
  </nav>
</div>

<div class="container">

  <!-- DASHBOARD -->
  <div id="sec-dashboard" class="section active">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="card">
      <div class="card-header"><div class="card-title">Розподіл по етапах</div></div>
      <div id="stage-chart"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Останні зміни</div></div>
      <div class="table-wrap"><table id="recent-table"><thead><tr><th>Номер</th><th>Назва</th><th>Статус</th><th>Етап</th><th>Ризик</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>

  <!-- BILLS -->
  <div id="sec-bills" class="section">
    <div class="filters">
      <input type="text" id="bill-search" placeholder="Пошук за номером або назвою..." oninput="loadBills()">
      <select id="bill-stage" onchange="loadBills()">
        <option value="">Всі етапи</option>
        <option value="1">1 — Зареєстровано</option>
        <option value="2">2 — Перше читання</option>
        <option value="3">3 — Друге читання</option>
        <option value="4">4 — Підписано</option>
        <option value="5">5 — Відхилено</option>
      </select>
      <select id="bill-status" onchange="loadBills()"></select>
    </div>
    <div class="card">
      <div class="table-wrap"><table id="bills-table"><thead><tr><th>Номер</th><th>Назва</th><th>Статус</th><th>Етап</th><th>Комітет</th><th>Ризик</th><th>Дата</th></tr></thead><tbody></tbody></table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span id="bills-count" style="font-size:13px;color:var(--text2)"></span>
        <div style="display:flex;gap:8px">
          <button class="back-btn" onclick="billsPage(-1)">← Назад</button>
          <button class="back-btn" onclick="billsPage(1)">Далі →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- BILL DETAIL -->
  <div id="sec-bill-detail" class="section">
    <button class="back-btn" onclick="showSection('bills')">← Назад до списку</button>
    <div id="bill-detail-content"></div>
  </div>

  <!-- DEPUTIES -->
  <div id="sec-deputies" class="section">
    <div class="filters">
      <input type="text" id="dep-search" placeholder="Пошук депутата..." oninput="loadDeputies()">
      <select id="dep-faction" onchange="loadDeputies()"></select>
      <select id="dep-sort" onchange="loadDeputies()">
        <option value="name">За ім'ям</option>
        <option value="kpd">За КПД ↓</option>
        <option value="total">За участю ↓</option>
      </select>
    </div>
    <div class="card">
      <div class="table-wrap"><table id="deputies-table"><thead><tr><th>Ім'я</th><th>Фракція</th><th>Участь</th><th>КПД</th><th>Голосувань</th></tr></thead><tbody></tbody></table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
        <span id="deputies-count" style="font-size:13px;color:var(--text2)"></span>
        <div style="display:flex;gap:8px">
          <button class="back-btn" onclick="depsPage(-1)">← Назад</button>
          <button class="back-btn" onclick="depsPage(1)">Далі →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- DEPUTY DETAIL -->
  <div id="sec-deputy-detail" class="section">
    <button class="back-btn" onclick="showSection('deputies')">← Назад до списку</button>
    <div id="deputy-detail-content"></div>
  </div>

  <!-- SCHEDULE -->
  <div id="sec-schedule" class="section">
    <div class="card">
      <div class="card-header"><div class="card-title">Пленарні засідання ВРУ</div></div>
      <div id="schedule-list"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Закони на голосування</div></div>
      <div id="upcoming-bills"></div>
    </div>
  </div>

</div>

<script>
const API = 'https://rada-monitor-api.distih.workers.dev';
let billsOffset = 0, depsOffset = 0, billsTotal = 0, depsTotal = 0;
const PAGE = 50;

// === Navigation ===
function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  document.querySelector(`nav button[onclick="showSection('${name}')"]`).classList.add('active');
  if (name === 'dashboard') loadDashboard();
  if (name === 'bills') loadBills();
  if (name === 'deputies') loadDeputies();
  if (name === 'schedule') loadSchedule();
}

// === API helpers ===
async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(`API ${r.status}`);
  return r.json();
}

function stageBadge(stage) {
  const cls = `badge-stage${stage || 1}`;
  const names = {1:'Зареєстровано',2:'Перше читання',3:'Друге читання',4:'Підписано',5:'Відхилено'};
  return `<span class="badge ${cls}">${names[stage] || '?'}</span>`;
}

function riskBadge(score) {
  if (!score || score === 0) return '<span class="badge badge-low">—</span>';
  if (score >= 2) return `<span class="badge badge-high">${score.toFixed(1)}</span>`;
  if (score >= 1) return `<span class="badge badge-medium">${score.toFixed(1)}</span>`;
  return `<span class="badge badge-low">${score.toFixed(1)}</span>`;
}

function kpdColor(kpd) {
  if (kpd >= 80) return 'var(--green)';
  if (kpd >= 50) return 'var(--orange)';
  return 'var(--red)';
}

function stageBar(current) {
  let html = '<div class="stage-bar">';
  for (let i = 1; i <= 5; i++) html += `<span class="${i <= current ? 'filled' : ''}"></span>`;
  return html + '</div>';
}

// === DASHBOARD ===
async function loadDashboard() {
  try {
    const data = await api('/api/stats');
    const grid = document.getElementById('stats-grid');
    grid.innerHTML = `
      <div class="stat-card"><div class="stat-label">Всього законів</div><div class="stat-value">${data.totalBills?.toLocaleString() || 0}</div></div>
      <div class="stat-card"><div class="stat-label">Підписано</div><div class="stat-value" style="color:var(--green)">${(data.byStage||[]).find(s=>s.stage===4)?.count||0}</div></div>
      <div class="stat-card"><div class="stat-label">Відхилено</div><div class="stat-value" style="color:var(--red)">${(data.byStage||[]).find(s=>s.stage===5)?.count||0}</div></div>
      <div class="stat-card"><div class="stat-label">Високий ризик</div><div class="stat-value" style="color:var(--orange)">${data.highRiskBills||0}</div></div>
      <div class="stat-card"><div class="stat-label">Голосувань</div><div class="stat-value">${data.totalVotes||0}</div></div>
      <div class="stat-card"><div class="stat-label">Депутатів</div><div class="stat-value">${data.totalMps||0}</div></div>
    `;

    // Stage chart
    const chart = document.getElementById('stage-chart');
    const stages = data.byStage || [];
    const total = stages.reduce((a,s) => a + s.count, 0) || 1;
    chart.innerHTML = stages.map(s => {
      const pct = (s.count / total * 100).toFixed(1);
      const colors = {1:'var(--muted)',2:'var(--blue)',3:'var(--purple)',4:'var(--green)',5:'var(--red)'};
      const names = {1:'Зареєстровано',2:'Перше читання',3:'Друге читання',4:'Підписано',5:'Відхилено'};
      return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span style="min-width:140px;font-size:13px">${names[s.stage]||'?'} (${s.count})</span>
        <div style="flex:1;height:20px;background:var(--border);border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${colors[s.stage]||'var(--blue)'};border-radius:4px"></div>
        </div>
        <span style="min-width:50px;text-align:right;font-size:13px;color:var(--text2)">${pct}%</span>
      </div>`;
    }).join('');

    // Recent changes
    const tbody = document.querySelector('#recent-table tbody');
    const bills = await api('/api/bills?limit=10&sort=updated_at&order=DESC');
    tbody.innerHTML = (bills.bills||[]).map(b => `<tr class="clickable" onclick="showBill(${b.id})">
      <td><strong>${b.bill_number}</strong></td>
      <td>${(b.title||'').substring(0,60)}${b.title?.length>60?'...':''}</td>
      <td>${b.current_status||'new'}</td>
      <td>${stageBadge(b.stage)}</td>
      <td>${riskBadge(b.risk_score)}</td>
    </tr>`).join('');
  } catch(e) { console.error('Dashboard error:', e); }
}

// === BILLS ===
async function loadBills() {
  const search = document.getElementById('bill-search').value;
  const stage = document.getElementById('bill-stage').value;
  const status = document.getElementById('bill-status').value;
  let url = `/api/bills?limit=${PAGE}&offset=${billsOffset}`;
  if (search) url += `&search=${encodeURIComponent(search)}`;
  if (stage) url += `&stage=${stage}`;
  if (status) url += `&status=${encodeURIComponent(status)}`;
  try {
    const data = await api(url);
    billsTotal = data.total || 0;
    document.getElementById('bills-count').textContent = `Показано ${billsOffset+1}–${Math.min(billsOffset+PAGE,billsTotal)} з ${billsTotal}`;
    const tbody = document.querySelector('#bills-table tbody');
    tbody.innerHTML = (data.bills||[]).map(b => `<tr class="clickable" onclick="showBill(${b.id})">
      <td><strong>${b.bill_number}</strong></td>
      <td>${(b.title||'').substring(0,70)}${b.title?.length>70?'...':''}</td>
      <td>${b.current_status||'new'}</td>
      <td>${stageBadge(b.stage)}</td>
      <td style="font-size:12px;color:var(--text2)">${(b.committee||'').substring(0,40)}</td>
      <td>${riskBadge(b.risk_score)}</td>
      <td style="font-size:12px;color:var(--text2)">${b.registration_date||''}</td>
    </tr>`).join('');
  } catch(e) { console.error('Bills error:', e); }
}
function billsPage(d) { billsOffset = Math.max(0, billsOffset + d * PAGE); loadBills(); }

// === BILL DETAIL ===
async function showBill(id) {
  showSection('bill-detail');
  const el = document.getElementById('bill-detail-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const data = await api(`/api/bills/${id}`);
    const b = data.bill;
    const risks = data.risks;
    const versions = data.versions || [];
    const votes = data.votes || [];

    let html = `
      <div class="detail-panel">
        <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:12px">
          <div>
            <h2 style="font-size:20px;margin-bottom:8px">#${b.bill_number} — ${(b.title||'').substring(0,100)}</h2>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              ${stageBar(b.stage)}
              ${stageBadge(b.stage)}
              ${riskBadge(risks?.overall_score)}
            </div>
          </div>
          ${b.url ? `<a href="${b.url}" target="_blank" class="back-btn">На сайті ВРУ →</a>` : ''}
        </div>
        <div style="margin-top:12px">
          <div class="detail-row"><div class="detail-label">Статус</div><div class="detail-value">${b.current_status||'new'}</div></div>
          <div class="detail-row"><div class="detail-label">Комітет</div><div class="detail-value">${b.committee||'—'}</div></div>
          <div class="detail-row"><div class="detail-label">Дата реєстрації</div><div class="detail-value">${b.registration_date||'—'}</div></div>
          ${b.act_number ? `<div class="detail-row"><div class="detail-label">Номер акту</div><div class="detail-value">${b.act_number} від ${b.act_date||'?'}</div></div>` : ''}
        </div>
      </div>`;

    // Tabs
    html += `<div class="tabs">
      <button class="active" onclick="showBillTab(this,'risks')">Ризики</button>
      <button onclick="showBillTab(this,'versions')">Версії (${versions.length})</button>
      <button onclick="showBillTab(this,'votes')">Голосування (${votes.length})</button>
    </div>`;

    // Risks tab
    if (risks && risks.json_data) {
      const risksList = JSON.parse(risks.json_data || '[]');
      if (risksList.length) {
        html += `<div id="tab-risks" class="bill-tab"><div class="risk-grid">${risksList.map(r => `
          <div class="risk-item">
            <div class="risk-cat">${r.category||'Other'} <span class="badge badge-${(r.severity||'low').toLowerCase()}">${r.severity||'Low'}</span></div>
            <div class="risk-quote">${r.quote||''}</div>
            <div class="risk-explanation">${r.explanation||''}</div>
          </div>`).join('')}</div></div>`;
      } else {
        html += `<div id="tab-risks" class="bill-tab"><p style="color:var(--text2)">Ризиків не виявлено</p></div>`;
      }
      if (risks.raw_analysis) {
        html += `<div id="tab-risks" class="bill-tab" style="margin-top:12px"><div class="card"><div class="card-title" style="margin-bottom:8px">Аналіз LLM</div><p style="font-size:14px;line-height:1.6">${risks.raw_analysis}</p></div></div>`;
      }
    } else {
      html += `<div id="tab-risks" class="bill-tab"><p style="color:var(--text2)">Аналіз не проведено</p></div>`;
    }

    // Versions tab
    html += `<div id="tab-versions" class="bill-tab" style="display:none">`;
    if (versions.length >= 2) {
      html += `<div style="margin-bottom:12px;display:flex;gap:8px;align-items:center">
        <label style="font-size:13px;color:var(--text2)">Порівняти:</label>
        <select id="ver-old" onchange="showDiff()" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:6px">
          ${versions.slice(1).map((v,i) => `<option value="${i+1}">${v.status_at_moment||'v'+(i+1)} (${v.text_hash?.substring(0,8)||'?'})</option>`).join('')}
        </select>
        <span style="color:var(--text2)">←</span>
        <select id="ver-new" onchange="showDiff()" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:6px">
          ${versions.slice(0,-1).map((v,i) => `<option value="${i}" ${i===0?'selected':''}>${v.status_at_moment||'v'+(versions.length-i)} (${v.text_hash?.substring(0,8)||'?'})</option>`).join('')}
        </select>
      </div>`;
      html += `<div class="diff-container"><div><div class="diff-header">Стара версія</div><div class="diff-panel" id="diff-old"></div></div><div><div class="diff-header">Нова версія</div><div class="diff-panel" id="diff-new"></div></div></div>`;
      window._billVersions = versions;
    } else if (versions.length === 1) {
      html += `<div class="card"><p style="color:var(--text2)">Є лише одна версія — порівняння неможливе</p><div class="diff-panel" style="margin-top:12px;max-height:400px;overflow-y:auto">${escHtml(versions[0].plain_text||'')}</div></div>`;
    } else {
      html += `<p style="color:var(--text2)">Версії відсутні</p>`;
    }
    html += `</div>`;

    // Votes tab
    html += `<div id="tab-votes" class="bill-tab" style="display:none">`;
    if (votes.length) {
      html += votes.map(v => {
        const total = (v.yes_count||0)+(v.no_count||0)+(v.abstain_count||0)+(v.not_present_count||0)+(v.absent_count||0);
        const yesPct = total ? (v.yes_count/total*100) : 0;
        const noPct = total ? (v.no_count/total*100) : 0;
        const absPct = total ? (v.abstain_count/total*100) : 0;
        const npPct = total ? ((v.not_present_count+v.absent_count)/total*100) : 0;
        return `<div class="card" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <span style="font-weight:600">${v.title||'Голосування'}</span>
            <span style="font-size:12px;color:var(--text2)">${v.vote_date||''}</span>
          </div>
          <div class="vote-bar">
            <div class="yes" style="width:${yesPct}%" title="За: ${v.yes_count}"></div>
            <div class="no" style="width:${noPct}%" title="Проти: ${v.no_count}"></div>
            <div class="abstain" style="width:${absPct}%" title="Утрималися: ${v.abstain_count}"></div>
            <div class="not-present" style="width:${npPct}%" title="Не голосували: ${v.not_present_count+v.absent_count}"></div>
          </div>
          <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text2)">
            <span style="color:var(--green)">За: ${v.yes_count}</span>
            <span style="color:var(--red)">Проти: ${v.no_count}</span>
            <span style="color:var(--orange)">Утрим: ${v.abstain_count}</span>
            <span>Не голос: ${(v.not_present_count||0)+(v.absent_count||0)}</span>
          </div>
          ${v.deputies && v.deputies.length ? `<div style="margin-top:8px;font-size:12px;color:var(--text2)">Депутатів: ${v.deputies.length}</div>` : ''}
        </div>`;
      }).join('');
    } else {
      html += `<p style="color:var(--text2)">Голосувань не знайдено</p>`;
    }
    html += `</div>`;

    el.innerHTML = html;
    if (versions.length >= 2) setTimeout(showDiff, 100);
  } catch(e) { el.innerHTML = `<p style="color:var(--red)">Помилка: ${e.message}</p>`; }
}

function showBillTab(btn, tab) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.bill-tab').forEach(t => t.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
}

function showDiff() {
  const versions = window._billVersions;
  if (!versions || versions.length < 2) return;
  const oldIdx = parseInt(document.getElementById('ver-old').value);
  const newIdx = parseInt(document.getElementById('ver-new').value);
  const oldText = versions[oldIdx]?.plain_text || '';
  const newText = versions[newIdx]?.plain_text || '';
  document.getElementById('diff-old').innerHTML = simpleDiff(oldText, newText, true);
  document.getElementById('diff-new').innerHTML = simpleDiff(newText, oldText, false);
}

function simpleDiff(text, other, isOld) {
  const lines = text.split('\n');
  const otherLines = new Set(other.split('\n').map(l => l.trim()));
  return lines.map(line => {
    const trimmed = line.trim();
    if (!trimmed) return escHtml(line);
    if (!otherLines.has(trimmed)) {
      return `<span class="${isOld ? 'removed' : 'added'}">${escHtml(line)}</span>`;
    }
    return escHtml(line);
  }).join('\n');
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// === DEPUTIES ===
async function loadDeputies() {
  const search = document.getElementById('dep-search').value;
  const faction = document.getElementById('dep-faction').value;
  const sort = document.getElementById('dep-sort').value;
  let url = `/api/deputies?limit=${PAGE}&offset=${depsOffset}`;
  if (search) url += `&search=${encodeURIComponent(search)}`;
  if (faction) url += `&faction=${encodeURIComponent(faction)}`;
  if (sort === 'kpd') url += `&sort=name`;
  try {
    const data = await api(url);
    depsTotal = data.deputies?.length || 0;
    document.getElementById('deputies-count').textContent = `Показано ${depsOffset+1}–${Math.min(depsOffset+PAGE,depsTotal)} з ${depsTotal}`;
    let deps = data.deputies || [];
    if (sort === 'kpd') deps.sort((a,b) => (b.kpd||0) - (a.kpd||0));
    if (sort === 'total') deps.sort((a,b) => (b.total||0) - (a.total||0));
    const tbody = document.querySelector('#deputies-table tbody');
    tbody.innerHTML = deps.map(d => `<tr class="clickable" onclick="showDeputy('${escAttr(d.name)}')">
      <td><strong>${d.name}</strong></td>
      <td style="font-size:13px">${d.faction||'—'}</td>
      <td>
        <div class="kpd-bar">
          <div class="kpd-track"><div class="kpd-fill" style="width:${d.kpd||0}%;background:${kpdColor(d.kpd||0)}"></div></div>
          <span class="kpd-value" style="color:${kpdColor(d.kpd||0)}">${d.kpd||0}%</span>
        </div>
      </td>
      <td>${d.kpd||0}%</td>
      <td>${d.total||0}</td>
    </tr>`).join('');
  } catch(e) { console.error('Deputies error:', e); }
}
function depsPage(d) { depsOffset = Math.max(0, depsOffset + d * PAGE); loadDeputies(); }
function escAttr(s) { return (s||'').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// === DEPUTY DETAIL ===
async function showDeputy(name) {
  showSection('deputy-detail');
  const el = document.getElementById('deputy-detail-content');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const data = await api(`/api/deputies/${encodeURIComponent(name)}`);
    const d = data.deputy;
    const votes = data.votes || [];

    let html = `
      <div class="detail-panel">
        <h2 style="font-size:20px;margin-bottom:8px">${d.name}</h2>
        <div class="detail-row"><div class="detail-label">Фракція</div><div class="detail-value">${d.faction||'—'}</div></div>
      </div>`;

    // Voting history
    if (votes.length) {
      html += `<div class="card"><div class="card-header"><div class="card-title">Історія голосувань (${votes.length})</div></div>
        <div class="table-wrap"><table><thead><tr><th>Дата</th><th>Закон</th><th>Рішення</th><th>Результат</th></tr></thead><tbody>`;
      html += votes.map(v => {
        const label = v.vote_label || v.vote_code || '?';
        const color = v.vote_code === 'yes' ? 'var(--green)' : v.vote_code === 'no' ? 'var(--red)' : v.vote_code === 'abstain' ? 'var(--orange)' : 'var(--muted)';
        return `<tr>
          <td style="font-size:12px">${v.vote_date||''}</td>
          <td>${v.bill_number ? '#'+v.bill_number : (v.vote_title||'').substring(0,50)}</td>
          <td style="color:${color};font-weight:600">${label}</td>
          <td style="font-size:12px;color:var(--text2)">${v.vote_title||''}</td>
        </tr>`;
      }).join('');
      html += `</tbody></table></div></div>`;
    } else {
      html += `<div class="card"><p style="color:var(--text2)">Даних про голосування поки немає</p></div>`;
    }

    el.innerHTML = html;
  } catch(e) { el.innerHTML = `<p style="color:var(--red)">Помилка: ${e.message}</p>`; }
}

// === SCHEDULE ===
async function loadSchedule() {
  try {
    const data = await api('/api/plenary-sessions');
    const sessions = data.sessions || [];
    const list = document.getElementById('schedule-list');
    if (!sessions.length) {
      list.innerHTML = '<p style="color:var(--text2)">Дані про засідання поки відсутні</p>';
    } else {
      list.innerHTML = sessions.map(s => `
        <div class="schedule-item">
          <div class="schedule-date">${s.date}</div>
          <div class="schedule-info">
            <div class="schedule-title">${(s.bills||[]).map(b => '#'+b.bill_number).join(', ') || '—'}</div>
            <div class="schedule-meta">${(s.bills||[]).length} закон(ів)</div>
          </div>
        </div>`).join('');
    }

    // Bills for voting
    const upcoming = await api('/api/bills?limit=10&stage=2&sort=registration_date&order=DESC');
    const ub = document.getElementById('upcoming-bills');
    if (upcoming.bills?.length) {
      ub.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Номер</th><th>Назва</th><th>Статус</th><th>Дата</th></tr></thead><tbody>${upcoming.bills.map(b => `
        <tr class="clickable" onclick="showBill(${b.id})">
          <td><strong>${b.bill_number}</strong></td>
          <td>${(b.title||'').substring(0,60)}</td>
          <td>${b.current_status||''}</td>
          <td style="font-size:12px;color:var(--text2)">${b.registration_date||''}</td>
        </tr>`).join('')}</tbody></table></div>`;
    } else {
      ub.innerHTML = '<p style="color:var(--text2)">Закони на голосування поки відсутні</p>';
    }
  } catch(e) { console.error('Schedule error:', e); }
}

// === INIT ===
loadDashboard();

// Load statuses for filter
api('/api/statuses').then(d => {
  const sel = document.getElementById('bill-status');
  (d.statuses||[]).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.current_status;
    opt.textContent = `${s.current_status} (${s.count})`;
    sel.appendChild(opt);
  });
}).catch(()=>{});

// Load factions for filter
api('/api/factions').then(d => {
  const sel = document.getElementById('dep-faction');
  (d.factions||[]).forEach(f => {
    const opt = document.createElement('option');
    opt.value = f;
    opt.textContent = f;
    sel.appendChild(opt);
  });
}).catch(()=>{});
</script>
