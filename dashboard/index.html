<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страж Демократії — Моніторинг ВРУ</title>
<style>
:root {
  --bg-primary: #0f0f1a;
  --bg-secondary: #1a1a2e;
  --bg-card: #16213e;
  --bg-hover: #1e2a45;
  --text-primary: #e0e6f0;
  --text-secondary: #8899b4;
  --text-muted: #5a6a85;
  --accent-blue: #4a9eff;
  --accent-green: #2ecc71;
  --accent-red: #e74c3c;
  --accent-orange: #f39c12;
  --accent-yellow: #f1c40f;
  --accent-purple: #9b59b6;
  --border-color: #2a2a4a;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
}

/* Layout */
.app-header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0; z-index: 100;
}
.app-header .header-left { flex: 1; }
.app-header .header-center { flex: 0 0 auto; text-align: center; }
.app-header .header-right { flex: 1; display: flex; justify-content: flex-end; }
.app-header h1 {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.app-header .subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  -webkit-text-fill-color: var(--text-secondary);
}
.header-stats { display: flex; gap: 20px; align-items: center; }
.header-stat { text-align: center; }
.header-stat .num { font-size: 20px; font-weight: 700; color: var(--accent-blue); }
.header-stat .label { font-size: 11px; color: var(--text-secondary); }

/* Tabs */
.tab-nav {
  display: flex;
  justify-content: center;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 0 24px;
  gap: 4px;
}
.tab-btn {
  padding: 14px 24px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
  font-family: var(--font);
}
.tab-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
.tab-btn.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }
.tab-content { display: none; padding: 24px; max-width: 1400px; margin: 0 auto; }
.tab-content.active { display: block; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  transition: var(--transition);
}
.card:hover { border-color: rgba(74,158,255,0.3); }
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Grids */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:768px){ .grid-2 { grid-template-columns: 1fr; } }

/* Bill items */
.bill-item {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: var(--transition);
}
.bill-item:hover { border-color: rgba(74,158,255,0.3); background: var(--bg-hover); }
.bill-item-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.bill-number { font-weight: 700; color: var(--accent-blue); font-size: 14px; }
.bill-title { flex: 1; font-size: 14px; }
.bill-status { padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.bill-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); }

/* Vote blocks */
.vote-block {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  overflow: hidden;
  transition: var(--transition);
}
.vote-block:hover { border-color: rgba(74,158,255,0.3); }
.vote-block.expanded { border-color: var(--accent-blue); }
.vote-block-header { padding: 14px 16px; cursor: pointer; transition: var(--transition); }
.vote-block-header:hover { background: var(--bg-hover); }
.vote-block-title { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.vote-block-summary { display: flex; gap: 12px; font-size: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.vote-count.za { color: var(--accent-green); }
.vote-count.proti { color: var(--accent-red); }
.vote-count.utr { color: var(--accent-orange); }
.vote-count.ne { color: var(--text-muted); }
.vote-count.vid { color: var(--text-muted); opacity: 0.7; }
.vote-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--bg-secondary); margin-bottom: 6px; }
.vote-bar-seg { height: 100%; }
.vote-bar-seg.za { background: var(--accent-green); }
.vote-bar-seg.proti { background: var(--accent-red); }
.vote-bar-seg.utr { background: var(--accent-orange); }
.vote-bar-seg.ne { background: var(--text-muted); }
.vote-bar-seg.vid { background: #3a3a5a; }
.vote-expand-hint { font-size: 11px; color: var(--text-muted); }
.vote-block.expanded .vote-expand-hint { color: var(--accent-blue); }
.vote-factions { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
.vote-block.expanded .vote-factions { max-height: 5000px; }

/* Faction detail */
.faction-detail-item { border-bottom: 1px solid var(--border-color); }
.faction-detail-header { display: flex; align-items: center; padding: 10px 16px; cursor: pointer; gap: 10px; }
.faction-detail-header:hover { background: var(--bg-hover); }
.faction-color { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.faction-name { flex: 1; font-size: 13px; font-weight: 500; }
.faction-mini-stats { display: flex; gap: 8px; font-size: 11px; }
.mini-stat.za { color: var(--accent-green); }
.mini-stat.proti { color: var(--accent-red); }
.mini-stat.utr { color: var(--accent-orange); }
.mini-stat.ne { color: var(--text-muted); }
.mini-stat.vid { color: var(--text-muted); opacity: 0.7; }
.faction-expand { color: var(--text-muted); font-size: 10px; transition: transform 0.3s; }
.faction-detail-item.open .faction-expand { transform: rotate(180deg); }
.faction-deputies { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; padding: 0 16px; }
.faction-detail-item.open .faction-deputies { max-height: 3000px; padding: 0 16px 10px; }
.deputy-row { display: flex; align-items: center; padding: 4px 8px; gap: 8px; font-size: 12px; border-radius: 4px; }
.deputy-row:hover { background: var(--bg-hover); }
.deputy-name { flex: 1; }
.deputy-vote { padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.deputy-vote.za { background: rgba(46,204,113,0.2); color: var(--accent-green); }
.deputy-vote.proti { background: rgba(231,76,60,0.2); color: var(--accent-red); }
.deputy-vote.utr { background: rgba(243,156,18,0.2); color: var(--accent-orange); }
.deputy-vote.ne { background: rgba(90,106,133,0.2); color: var(--text-muted); }
.deputy-vote.vid { background: rgba(90,106,133,0.15); color: var(--text-muted); }

/* Detail panel */
.bill-detail { display: none; }
.bill-detail.open { display: block; }
.bill-detail-close { float: right; background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }
.detail-section { margin-top: 20px; }
.detail-section h3 { font-size: 14px; margin-bottom: 10px; color: var(--text-secondary); }

/* Deputies table */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th, .data-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
.data-table th { color: var(--text-secondary); font-weight: 600; cursor: pointer; }
.data-table th:hover { color: var(--text-primary); }
.data-table tbody tr:hover { background: var(--bg-hover); }

/* Toolbar */
.deputies-toolbar { display: flex; gap: 12px; margin-bottom: 16px; }
.deputies-toolbar input, .deputies-toolbar select {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: var(--font);
}
.deputies-toolbar input { flex: 1; }
.deputies-toolbar select { min-width: 180px; }
.bill-search {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: var(--font);
  margin-bottom: 16px;
}

/* Calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; text-align: center; font-size: 12px; }
.cal-header { color: var(--text-muted); padding: 4px; font-weight: 600; }
.cal-day { padding: 6px; border-radius: 4px; }
.cal-day.today { background: var(--accent-blue); color: #fff; }
.cal-day.vote { background: rgba(46,204,113,0.3); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Responsive */
@media(max-width:768px) {
  .app-header { flex-direction: column; gap: 8px; }
  .header-stats { flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="header-left"></div>
  <div class="header-center">
    <h1>🏛️ Страж Демократії</h1>
    <div class="subtitle">Моніторинг Верховної Ради України · IX скликання</div>
  </div>
  <div class="header-right">
    <div class="header-stats">
      <div class="header-stat"><div class="num" id="headerBills">-</div><div class="label">Законів</div></div>
      <div class="header-stat"><div class="num" id="headerVotes">-</div><div class="label">Голосувань</div></div>
      <div class="header-stat"><div class="num" id="headerDeputies">-</div><div class="label">Депутатів</div></div>
      <div class="header-stat"><div class="num" id="headerFactions">-</div><div class="label">Фракцій</div></div>
    </div>
  </div>
</header>

<!-- Tabs -->
<nav class="tab-nav">
  <button class="tab-btn active" data-tab="dashboard">📊 Дашборд</button>
  <button class="tab-btn" data-tab="bills">📜 Законопроєкти</button>
  <button class="tab-btn" data-tab="deputies">👥 Депутати</button>
</nav>

<!-- Dashboard -->
<section id="tab-dashboard" class="tab-content active">
  <div class="grid-2">
    <div class="card">
      <div class="card-title">📌 Останні закони</div>
      <div id="dashBillList"></div>
    </div>
    <div class="card">
      <div class="card-title">📅 Календарь пленарних засідань</div>
      <div id="dashCalendar"></div>
    </div>
  </div>
</section>

<!-- Bills -->
<section id="tab-bills" class="tab-content">
  <input class="bill-search" id="billSearch" type="text" placeholder="🔍 Пошук за номером або назвою...">
  <div id="billListContainer"></div>
  <div id="billDetailPanel" class="card bill-detail"></div>
</section>

<!-- Deputies -->
<section id="tab-deputies" class="tab-content">
  <div class="deputies-toolbar">
    <input type="text" id="depSearch" placeholder="🔍 Пошук за ПІБ або фракцією...">
    <select id="depFactionFilter"><option value="">Усі фракції</option></select>
  </div>
  <div class="card" style="overflow-x:auto;padding:0;">
    <table class="data-table">
      <thead><tr><th>ПІБ</th><th>Фракція</th><th>Голосувань</th><th>КПД</th></tr></thead>
      <tbody id="deputiesBody"></tbody>
    </table>
  </div>
</section>

<script>
// ===== DATA =====
let FACTIONS = [];
let BILLS = [];
let ALL_DEPUTIES = [];

async function loadData() {
  try {
    const [billsRes, factionsRes, deputiesRes] = await Promise.all([
      fetch('/api/bills'),
      fetch('/api/factions'),
      fetch('/api/deputies')
    ]);
    BILLS = await billsRes.json();
    FACTIONS = (await factionsRes.json()).map(f => ({...f, color: getFactionColor(f.name)}));
    ALL_DEPUTIES = await deputiesRes.json();
    document.getElementById('headerBills').textContent = BILLS.length;
    document.getElementById('headerVotes').textContent = BILLS.reduce((s,b) => s + b.votes.length, 0);
    document.getElementById('headerDeputies').textContent = ALL_DEPUTIES.length;
    document.getElementById('headerFactions').textContent = FACTIONS.length;
  } catch(e) {
    console.error('Failed to load data:', e);
  }
}

function getFactionColor(name) {
  return {'СЛУГА НАРОДУ':'#19950b','Європейська Солідарність':'#ffff00','Батьківщина':'#0057b8','Платформа за життя та мир':'#ff6600','ДОВІРА':'#00bcd4','Партія "За майбутнє"':'#ff9800','ГОЛОС':'#9c27b0','Відновлення України':'#4caf50','Позафракційні':'#888888'}[name] || '#888888';
}

// ===== HELPERS =====
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs))
    if (k==='className') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k==='style' && typeof v==='object') Object.assign(e.style, v);
    else e.setAttribute(k, v);
  for (const c of children)
    if (typeof c==='string') e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  return e;
}

// ===== TABS =====
$$('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tab-btn').forEach(b => b.classList.remove('active'));
    $$('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    $('#tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ===== DASHBOARD =====
function renderDashboard() {
  const list = $('#dashBillList');
  if (!list) return;
  list.innerHTML = '';
  BILLS.slice().sort((a,b) => {
    const pd = d => { const [dd,mm,yy]=d.date.split('.'); return new Date('20'+yy,mm-1,dd); };
    return pd(b) - pd(a);
  }).slice(0,5).forEach(b => {
    list.appendChild(el('div', {className:'bill-item', onclick:()=>toggleBillDetail(b.id)},
      el('div', {className:'bill-item-header'},
        el('span', {className:'bill-number'}, '#'+b.number),
        el('span', {className:'bill-title'}, b.title.slice(0,60)+(b.title.length>60?'...':'')),
        el('span', {style:'background:rgba(46,204,113,0.2);color:#2ecc71', className:'bill-status'}, b.type||'Закон')
      ),
      el('div', {className:'bill-meta'},
        el('span', {}, '📅 '+b.date),
        el('span', {}, '🗳️ '+b.votes.length+' голосувань')
      )
    ));
  });
  renderCalendar();
}

function renderCalendar() {
  const cal = $('#dashCalendar');
  if (!cal) return;
  const now = new Date(), year = now.getFullYear(), month = now.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const monthNames = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  const votingDays = new Set();
  BILLS.forEach(b => { if(b.date){const [dd,mm]=b.date.split('.');if(parseInt(mm)===month+1)votingDays.add(parseInt(dd));} });
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><span style="font-weight:600">${monthNames[month]} ${year}</span></div>`;
  html += '<div class="cal-grid">';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].forEach(d => html += `<div class="cal-header">${d}</div>`);
  const offset = firstDay===0?6:firstDay-1;
  for(let i=0;i<offset;i++) html += '<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const cls = d===now.getDate()?'cal-day today':votingDays.has(d)?'cal-day vote':'cal-day';
    html += `<div class="${cls}">${d}</div>`;
  }
  html += '</div>';
  cal.innerHTML = html;
}

// ===== BILLS =====
function renderBills(filter) {
  const container = $('#billListContainer');
  if (!container) return;
  container.innerHTML = '';
  BILLS.filter(b => !filter || b.number.includes(filter) || b.title.toLowerCase().includes(filter.toLowerCase()))
  .sort((a,b) => { const pd=d=>{const [dd,mm,yy]=d.date.split('.');return new Date('20'+yy,mm-1,dd);}; return pd(b)-pd(a); })
  .forEach(b => {
    const item = el('div', {className:'bill-item'},
      el('div', {className:'bill-item-header'},
        el('span', {className:'bill-number'}, '#'+b.number),
        el('span', {className:'bill-title'}, b.title),
        el('span', {style:'background:rgba(46,204,113,0.2);color:var(--accent-green)', className:'bill-status'}, b.type||'Закон')
      ),
      el('div', {className:'bill-meta'},
        el('span', {}, '📅 '+b.date),
        el('span', {}, '🗳️ '+b.votes.length+' голосувань')
      )
    );
    item.addEventListener('click', () => toggleBillDetail(b.id));
    container.appendChild(item);
  });
}

// ===== BILL DETAIL =====
let selectedBillId = null;

function toggleBillDetail(id) {
  if (selectedBillId === id) { $('#billDetailPanel').classList.remove('open'); selectedBillId = null; return; }
  selectedBillId = id;
  const bill = BILLS.find(b => b.id === id);
  if (!bill) return;
  const panel = $('#billDetailPanel');
  
  let votesHtml = '';
  bill.votes.forEach((v, vi) => {
    const total = v.za+v.proti+v.utr+v.ne+v.vid || 1;
    const bw = p => Math.max(0, Math.round(p/total*100));
    votesHtml += `<div class="vote-block" data-vote-idx="${vi}">
      <div class="vote-block-header">
        <div class="vote-block-title">Голосування #${vi+1}</div>
        <div class="vote-block-summary">
          <span class="vote-count za">✅ ${v.za} За</span>
          <span class="vote-count proti">❌ ${v.proti} Проти</span>
          <span class="vote-count utr">⏸️ ${v.utr} Утр</span>
          <span class="vote-count ne">⬜ ${v.ne} Не голос</span>
          <span class="vote-count vid">🚫 ${v.vid} Відсут</span>
        </div>
        <div class="vote-bar">
          <div class="vote-bar-seg za" style="width:${bw(v.za)}%"></div>
          <div class="vote-bar-seg proti" style="width:${bw(v.proti)}%"></div>
          <div class="vote-bar-seg utr" style="width:${bw(v.utr)}%"></div>
          <div class="vote-bar-seg ne" style="width:${bw(v.ne)}%"></div>
          <div class="vote-bar-seg vid" style="width:${bw(v.vid)}%"></div>
        </div>
        <span class="vote-expand-hint">▼ Фракції</span>
      </div>
      <div class="vote-factions" id="vf-${vi}"></div>
    </div>`;
  });

  panel.innerHTML = `<button class="bill-detail-close" onclick="$('#billDetailPanel').classList.remove('open');selectedBillId=null;">✕</button>
    <div style="margin-bottom:16px;">
      <span style="font-weight:700;font-size:18px;">#${bill.number}</span>
      <span style="font-size:13px;color:var(--text-secondary);margin-left:8px;">${bill.date}</span>
      <span style="margin-left:10px;padding:2px 10px;border-radius:20px;font-size:11px;background:rgba(46,204,113,0.2);color:var(--accent-green);">${bill.type||'Закон'}</span>
    </div>
    <p style="font-size:15px;margin-bottom:16px;">${bill.title}</p>
    <div class="detail-section"><h3>🗳️ Результати голосувань</h3><p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Натисніть на голосування щоб побачити розбивку по фракціях</p>${votesHtml}</div>`;
  
  panel.classList.add('open');
  
  panel.querySelectorAll('.vote-block').forEach((block, vi) => {
    block.querySelector('.vote-block-header').addEventListener('click', () => {
      block.classList.toggle('expanded');
      const fc = block.querySelector('.vote-factions');
      if (block.classList.contains('expanded') && !fc.innerHTML) renderVoteFactions(bill, vi, fc);
    });
  });
}

function renderVoteFactions(bill, voteIdx, container) {
  const vote = bill.votes[voteIdx];
  if (!vote || !vote.factions) return;
  container.innerHTML = vote.factions.map(f => {
    const safe = f.name.replace(/[^a-zA-Zа-яА-Я0-9]/g,'');
    return `<div class="faction-detail-item">
      <div class="faction-detail-header">
        <span class="faction-color" style="background:${getFactionColor(f.name)}"></span>
        <span class="faction-name">${f.name}</span>
        <span class="faction-mini-stats">
          <span class="mini-stat za">✅${f.za}</span>
          <span class="mini-stat proti">❌${f.proti}</span>
          <span class="mini-stat utr">⏸️${f.utr}</span>
          <span class="mini-stat ne">⬜${f.ne}</span>
          <span class="mini-stat vid">🚫${f.vid}</span>
        </span>
        <span class="faction-expand">▼</span>
      </div>
      <div class="faction-deputies" id="fd-${bill.id}-${voteIdx}-${safe}"></div>
    </div>`;
  }).join('');
  
  container.querySelectorAll('.faction-detail-header').forEach(fh => {
    fh.addEventListener('click', async () => {
      const item = fh.parentElement;
      const dc = item.querySelector('.faction-deputies');
      item.classList.toggle('open');
      if (item.classList.contains('open') && !dc.innerHTML) {
        const fname = fh.querySelector('.faction-name').textContent;
        try {
          const res = await fetch(`/api/deputies/${bill.id}/${vote.g_id}`);
          const deps = await res.json();
          const fd = deps.filter(d => d.faction === fname);
          const sc = v => v==='За'?'za':v==='Проти'?'proti':v==='Утримався'?'utr':v==='Не голосував'?'ne':'vid';
          dc.innerHTML = fd.map(d => `<div class="deputy-row"><span class="deputy-name">${d.name}</span><span class="deputy-vote ${sc(d.vote)}">${d.vote}</span></div>`).join('');
        } catch(e) { dc.innerHTML = '<div class="deputy-row"><span>Помилка</span></div>'; }
      }
    });
  });
}

// ===== DEPUTIES =====
function renderDeputies(filter, factionFilter) {
  const tbody = $('#deputiesBody');
  if (!tbody) return;
  tbody.innerHTML = '';
  let deps = ALL_DEPUTIES;
  if (filter) { const f = filter.toLowerCase(); deps = deps.filter(d => d.name.toLowerCase().includes(f) || d.faction.toLowerCase().includes(f)); }
  if (factionFilter) deps = deps.filter(d => d.faction_id == factionFilter);
  deps.forEach(d => {
    tbody.appendChild(el('tr', {}, el('td',{},d.name), el('td',{},d.faction), el('td',{},'-'), el('td',{},'-')));
  });
}

// Search
$('#billSearch')?.addEventListener('input', function() { renderBills(this.value); });
$('#depSearch')?.addEventListener('input', function() { renderDeputies(this.value, $('#depFactionFilter')?.value||''); });
$('#depFactionFilter')?.addEventListener('change', function() { renderDeputies($('#depSearch')?.value||'', this.value); });

// Populate faction filter
const facSel = $('#depFactionFilter');
if (facSel) FACTIONS.forEach(f => { const o = document.createElement('option'); o.value = f.id; o.textContent = f.name; facSel.appendChild(o); });

// ===== INIT =====
async function init() {
  await loadData();
  renderDashboard();
  renderBills('');
  renderDeputies('', '');
}
init();
</script>
